<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Management Form — JsonPowerDB</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
</head>
<body>

    <!-- Loading Overlay -->
    <div id="loading-overlay" class="loading-overlay" style="display:none;">
        <div class="spinner"></div>
    </div>

    <div class="page">

        <!-- Page Header -->
        <header class="page-header">
            <h1>Project Management Form</h1>
            <p>CRUD operations on <strong>COLLEGE-DB</strong> &middot; <strong>PROJECT-TABLE</strong> &middot; powered by JsonPowerDB</p>
        </header>

        <!-- Notification -->
        <div id="notification" class="notification" style="display:none;"></div>

        <!-- Form -->
        <form id="projectForm" autocomplete="off" novalidate>

            <!-- Project ID — the primary key, given its own visual weight -->
            <fieldset class="field-group field-group--pk">
                <legend>Primary Key</legend>
                <div class="field">
                    <label for="projectId">Project-ID <abbr title="required">*</abbr></label>
                    <input type="text" id="projectId" name="Project-ID"
                           placeholder="e.g. PRJ-101"
                           autofocus>
                    <span class="field-hint">Enter an ID and press Tab or Enter to look it up.</span>
                </div>
            </fieldset>

            <!-- Remaining fields -->
            <div class="field-group">
                <div class="field">
                    <label for="projectName">Project-Name <abbr title="required">*</abbr></label>
                    <input type="text" id="projectName" name="Project-Name"
                           placeholder="Name of the project" disabled>
                </div>

                <div class="field">
                    <label for="assignedTo">Assigned-To <abbr title="required">*</abbr></label>
                    <input type="text" id="assignedTo" name="Assigned-To"
                           placeholder="Person responsible" disabled>
                </div>

                <div class="field-row">
                    <div class="field">
                        <label for="assignmentDate">Assignment-Date <abbr title="required">*</abbr></label>
                        <input type="date" id="assignmentDate" name="Assignment-Date" disabled>
                    </div>
                    <div class="field">
                        <label for="deadline">Deadline <abbr title="required">*</abbr></label>
                        <input type="date" id="deadline" name="Deadline" disabled>
                    </div>
                </div>
            </div>

            <!-- Actions -->
            <div class="actions">
                <button type="button" id="btnSave" class="btn btn--primary" disabled>Save</button>
                <button type="button" id="btnUpdate" class="btn btn--secondary" disabled>Update</button>
                <button type="button" id="btnReset" class="btn btn--ghost">Reset</button>
            </div>

        </form>

        <!-- Footer -->
        <footer class="page-footer">
            <span>Project Management Form &mdash; Micro Project</span>
            <span>Database: <a href="http://login2explore.com/jpdb/docs.html" target="_blank" rel="noopener">JsonPowerDB</a></span>
        </footer>

    </div>

    <script src="js/script.js"></script>
</body>
</html>
